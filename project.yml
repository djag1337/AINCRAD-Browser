name: AINCRADBrowser
options:
  bundleIdPrefix: com.djag
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "0.17.0"
    CURRENT_PROJECT_VERSION: "17"
    DEVELOPMENT_TEAM: UWC6NUWUHW
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  AINCRADBrowser:
    type: application
    platform: macOS
    sources: [Browser]
    info:
      path: Browser/Info.plist
      properties:
        CFBundleDisplayName: AINCRAD Browser
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "13.0"
        NSPrincipalClass: NSApplication
        NSCameraUsageDescription: AINCRAD Browser uses the camera only when a website you approve requests it.
        NSMicrophoneUsageDescription: AINCRAD Browser uses the microphone only when a website you approve requests it.
        NSLocationUsageDescription: AINCRAD Browser shares location only with websites you approve.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        CFBundleURLTypes:
          - CFBundleURLName: Web URL
            CFBundleURLSchemes: [http, https]
          - CFBundleURLName: com.djag.aincrad.browser
            CFBundleURLSchemes: [aincrad-browser]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djag.aincrad.browser
        PRODUCT_NAME: AINCRAD Browser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
